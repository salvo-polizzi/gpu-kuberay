apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vscode-ray.fullname" . }}
  labels:
{{ include "vscode-ray.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
{{ include "vscode-ray.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "vscode-ray.selectorLabels" . | nindent 8 }}
{{- with .Values.podLabels }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.podAnnotations }}
      annotations:
{{ toYaml . | nindent 8 }}
{{- end }}
    spec:
      securityContext:
{{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: code-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: RAY_ADDRESS
              value: {{ .Values.ray.address | quote }}
            - name: SHARED_STORAGE_PATH
              value: {{ .Values.ray.sharedStoragePath | quote }}
{{- with .Values.env }}
{{ toYaml . | nindent 12 }}
{{- end }}
          securityContext:
{{ toYaml .Values.securityContext | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | nindent 12 }}
{{- if .Values.sharedStorage.enabled }}
          volumeMounts:
            - name: shared-storage
              mountPath: {{ .Values.sharedStorage.mountPath | quote }}
{{- end }}
{{- if .Values.sharedStorage.enabled }}
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: {{ .Values.sharedStorage.existingClaim | quote }}
{{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
{{- end }}
