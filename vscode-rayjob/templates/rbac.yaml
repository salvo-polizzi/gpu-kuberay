apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vscode-rayjob.serviceAccountName" . }}
  labels:
{{ include "vscode-rayjob.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayjobs"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["ray.io"]
    resources: ["rayclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vscode-rayjob.serviceAccountName" . }}
  labels:
{{ include "vscode-rayjob.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vscode-rayjob.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vscode-rayjob.serviceAccountName" . }}
