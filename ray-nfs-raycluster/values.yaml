nameOverride: ''
fullnameOverride: ''
nfs:
  enabled: true
  namespace:
    create: true
    name: nfs-system
  server:
    name: nfs-server
    replicas: 1
    image: itsthenetwork/nfs-server-alpine:latest
    sharedDirectory: /exports
    hostPath:
      path: /mnt/nfs-data
      type: DirectoryOrCreate
    securityContext:
      privileged: true
    service:
      type: ClusterIP
      ports:
      - name: nfs
        port: 2049
        targetPort: 2049
      - name: mountd
        port: 20048
        targetPort: 20048
      - name: rpcbind
        port: 111
        targetPort: 111
  storageClass:
    name: nfs-direct
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
  pv:
    name: ray-shared-nfs-pv
    capacity: 50Gi
    accessModes:
    - ReadWriteMany
    mountOptions:
    - nfsvers=4
    - proto=tcp
    - timeo=600
    - retrans=2
    - hard
    nfs:
      server: 10.43.160.111
      path: /
sharedPvc:
  create: true
  name: ray-shared-pvc
  storageClassName: nfs-direct
  volumeName: ray-shared-nfs-pv
  accessModes:
  - ReadWriteMany
  size: 50Gi
rayCluster:
  name: raycluster-autoscaler-demo
  apiVersion: ray.io/v1
  rayVersion: 2.47.1
  enableInTreeAutoscaling: true
  sharedMountPath: /shared
  head:
    rayStartParams:
      num-cpus: '0'
    initSharedStorage:
      enabled: true
      image: busybox
      runAsUser: 0
      command:
      - sh
      - -c
      args: 'echo "Creating shared directory structure..."

        mkdir -p /shared/models /shared/datasets /shared/uploads /shared/checkpoints

        chmod -R 777 /shared

        echo "Shared storage initialized successfully!"

        '
    image: rayproject/ray:2.47.1.aeaf41-py311-cpu
    ports:
    - containerPort: 6379
      name: gcs
      protocol: TCP
    - containerPort: 8265
      name: dashboard
      protocol: TCP
    - containerPort: 10001
      name: client
      protocol: TCP
    resources:
      limits:
        cpu: '1'
        memory: 4G
      requests:
        cpu: '1'
        memory: 2G
  workers:
    cpuGroup:
      enabled: true
      groupName: cpu-group
      minReplicas: 1
      maxReplicas: 5
      replicas: 0
      image: rayproject/ray:2.47.1.aeaf41-py311-cpu
      name: ray-worker
      resources:
        limits:
          cpu: '1'
          memory: 8G
        requests:
          cpu: '1'
          memory: 1G
      rayStartParams: {}
    gpuGroup:
      enabled: true
      groupName: gpu-group
      minReplicas: 1
      maxReplicas: 4
      replicas: 0
      image: rayproject/ray:2.47.1.aeaf41-py311-gpu
      name: ray-node
      resources:
        limits:
          cpu: 1
          memory: 8G
          nvidia.com/gpu: 1
        requests:
          cpu: 1
          memory: 1G
          nvidia.com/gpu: 1
      rayStartParams: {}
      runtimeClassName: nvidia
headService:
  enabled: true
  name: ray-cluster-head-svc
  type: NodePort
  ports:
  - name: client
    port: 10001
    targetPort: 10001
    nodePort: 30002
  - name: dashboard
    port: 8265
    targetPort: 8265
    nodePort: 30266
